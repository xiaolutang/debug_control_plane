name: flutter_debug_control_plane
description: "Flutter bridge for the debug_control_plane Kotlin core (Android only). MethodChannel bridge: Dart Capability -> native ControlPlane."
version: 0.0.1
# R025-BF004-2: publish_to 'none' is deliberate — design decision C (no
# pre-release in this RC). Consumers use path/includeBuild (pantas_launcher
# pubspec.yaml declares both packages via `path:`). The future release task
# flips this to pub.dev 0.1.0 AFTER the Kotlin core tag lands on JitPack
# (spike-b §5 checklist).
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  debug_control_plane:
    path: ../dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pantas.debug.controlplane.flutter
        pluginClass: DebugControlPlaneFlutterPlugin
