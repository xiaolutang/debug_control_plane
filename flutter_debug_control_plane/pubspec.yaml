name: flutter_debug_control_plane
description: "Flutter bridge for the debug_control_plane Kotlin core (Android only). MethodChannel bridge: Dart Capability -> native ControlPlane."
version: 0.0.1
# 本地先行（不发版）：依赖同 repo 的 Dart 核心与 Kotlin 核心（path / includeBuild）。
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  debug_control_plane:
    path: ../dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pantas.debug.controlplane.flutter
        pluginClass: DebugControlPlaneFlutterPlugin
